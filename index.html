<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>皮拉提斯課程預約系統</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@500;700&display=swap">
<style>
/* Layout: phone-first member app; admin switches to sidebar + workspace at desktop width */
:root{
  --bg:#F2F3F1; --surface:#FFFFFF; --sunk:#E7EAE6; --line:#D6DBD5;
  --ink:#1D2523; --muted:#5E6A66; --accent:#2E5E54; --accent-ink:#FFFFFF; --accent-soft:#DCE8E3;
  --line-green:#06C755; --ok:#2F7A4B; --warn:#A36A12; --bad:#B23B3B;
  --f-display:"Noto Serif TC","Songti TC",serif;
  --f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --r:10px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#141917; --surface:#1C2320; --sunk:#232B28; --line:#323D39;
  --ink:#E6ECE9; --muted:#9AA8A3; --accent:#7FB8A8; --accent-ink:#0F1A17; --accent-soft:#24362F;
  --ok:#6CC58F; --warn:#E0A84A; --bad:#E57A7A; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141917; --surface:#1C2320; --sunk:#232B28; --line:#323D39;
  --ink:#E6ECE9; --muted:#9AA8A3; --accent:#7FB8A8; --accent-ink:#0F1A17; --accent-soft:#24362F;
  --ok:#6CC58F; --warn:#E0A84A; --bad:#E57A7A; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6}
h1,h2,h3{font-family:var(--f-display);font-weight:700;margin:0;text-wrap:balance;line-height:1.3}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:13px}
.label{font-size:12px;letter-spacing:.08em;color:var(--muted)}

.btn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 16px;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad);border-color:var(--bad);background:transparent}
.btn.sm{padding:4px 12px;font-size:13px}
.btn:disabled{opacity:.45;cursor:not-allowed}

.pill{display:inline-block;font-size:12px;padding:2px 10px;border-radius:999px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.pill.ok{background:color-mix(in srgb,var(--ok) 16%,transparent);color:var(--ok)}
.pill.warn{background:color-mix(in srgb,var(--warn) 16%,transparent);color:var(--warn)}
.pill.bad{background:color-mix(in srgb,var(--bad) 14%,transparent);color:var(--bad)}
.pill.acc{background:var(--accent-soft);color:var(--accent)}

/* demo bar */
.demobar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:center;padding:8px 16px;background:var(--sunk);font-size:13px;color:var(--muted)}
.demobar b{color:var(--ink)}

/* login */
.login{max-width:400px;margin:0 auto;padding:48px 16px 64px;display:grid;gap:24px}
.brand{display:grid;gap:4px}
.brand .mark{width:44px;height:44px;border-radius:50%;border:2px solid var(--accent);display:grid;place-items:center;color:var(--accent);font-family:var(--f-display);font-size:20px}
.brand h1{font-size:28px;margin-top:12px}
.oauth{display:grid;gap:12px}
.oauth button{display:flex;align-items:center;justify-content:center;gap:10px;border-radius:var(--r);padding:12px;font-weight:700;border:1px solid var(--line);background:var(--surface)}
.oauth .line{background:var(--line-green);color:#fff;border-color:var(--line-green)}
.oauth svg{width:20px;height:20px}
.form{display:grid;gap:14px}
.field{display:grid;gap:4px}
.field input,.field select{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:10px 12px;width:100%}
.check{display:flex;gap:8px;align-items:flex-start;font-size:14px}

/* member app */
.app{max-width:560px;margin:0 auto;padding-block:0 96px}
.mhead{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:20px 16px 12px}
.credit{text-align:right}
.credit .n{font-family:var(--f-display);font-size:28px;color:var(--accent);line-height:1}
.days{display:flex;gap:8px;overflow-x:auto;padding:4px 16px 12px;scrollbar-width:none}
.day{flex:0 0 auto;width:56px;padding:8px 0;border-radius:var(--r);border:1px solid var(--line);background:var(--surface);text-align:center;line-height:1.3}
.day .d{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums}
.day.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.list{display:grid;gap:10px;padding:0 16px}
.cls{display:grid;grid-template-columns:64px 1fr auto;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.cls .t{font-weight:700;font-variant-numeric:tabular-nums;line-height:1.2}
.cls .info{min-width:0}
.cls .name{font-weight:700}
.seats{display:flex;gap:3px;margin-top:6px}
.seats i{width:8px;height:8px;border-radius:2px;background:var(--sunk);border:1px solid var(--line)}
.seats i.f{background:var(--accent);border-color:var(--accent)}
.empty{padding:32px 16px;text-align:center;color:var(--muted)}
.tabbar{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px)}
.tabbar button{flex:1;max-width:180px;border:0;background:none;padding:12px 0;color:var(--muted);font-weight:500}
.tabbar button.on{color:var(--accent);box-shadow:inset 0 2px 0 var(--accent)}
.sec{padding:8px 16px;display:grid;gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.kv{display:grid;grid-template-columns:96px 1fr;gap:6px 12px}

/* admin */
.admin{display:grid;grid-template-columns:220px 1fr;min-height:100vh}
.side{background:var(--surface);border-right:1px solid var(--line);padding:24px 12px;display:flex;flex-direction:column;gap:4px}
.side h2{font-size:18px;padding:0 12px 16px}
.side button{text-align:left;border:0;background:none;padding:10px 12px;border-radius:8px;color:var(--muted);font-weight:500}
.side button.on{background:var(--accent-soft);color:var(--accent)}
.side .spacer{flex:1}
.work{padding:28px 32px 64px;min-width:0;display:grid;gap:20px;align-content:start}
.work-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.work-head h1{font-size:24px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.stat .v{font-family:var(--f-display);font-size:30px;line-height:1.2}
.tbl-wrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
table{border-collapse:collapse;width:100%;min-width:640px}
th,td{text-align:left;padding:10px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:12px;letter-spacing:.06em;color:var(--muted);font-weight:500;background:var(--sunk)}
tr:last-child td{border-bottom:0}
.bar{height:6px;background:var(--sunk);border-radius:3px;overflow:hidden;width:90px}
.bar span{display:block;height:100%;background:var(--accent)}
.row-actions{display:flex;gap:6px;flex-wrap:wrap}
.filters{display:flex;gap:8px;flex-wrap:wrap}
.filters select,.filters input{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 10px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.stepper{display:inline-flex;align-items:center;gap:6px}
.stepper button{width:26px;height:26px;border-radius:50%;border:1px solid var(--line);background:var(--surface);padding:0;line-height:1}

/* modal + toast */
.scrim{position:fixed;inset:0;background:color-mix(in srgb,#000 45%,transparent);display:grid;place-items:center;padding:16px;z-index:20}
.modal{background:var(--surface);border-radius:14px;padding:22px;width:100%;max-width:460px;display:grid;gap:16px;max-height:90vh;overflow:auto}
.modal .acts{display:flex;justify-content:flex-end;gap:8px}
.toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-size:14px;z-index:30;max-width:calc(100% - 32px)}

@media (max-width:820px){
  .admin{grid-template-columns:1fr}
  .side{flex-direction:row;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line);padding:10px 12px;position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
  .side h2,.side .spacer{display:none}
  .side button{flex:0 0 auto}
  .work{padding:20px 16px 64px}
  .stats{grid-template-columns:1fr 1fr}
  .grid2{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<div class="demobar">原型展示｜目前身分：<b id="whoami">未登入</b>
  <button class="btn sm ghost" id="demo-member">切換：會員</button>
  <button class="btn sm ghost" id="demo-admin">切換：管理員</button>
  <button class="btn sm ghost" id="demo-reset">登出</button>
</div>
<div id="root"></div>
<div id="layer"></div>

<script>
// ---------- helpers ----------
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2, '0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const WD = ['日','一','二','三','四','五','六'];
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
const today = new Date(); today.setHours(0,0,0,0);
const fmtDate = s => { const d = new Date(s + 'T00:00'); return `${d.getMonth()+1}/${d.getDate()}（${WD[d.getDay()]}）`; };
const startOf = c => new Date(`${c.date}T${c.start}`);
const endTime = c => { const d = new Date(startOf(c).getTime() + c.dur*60000); return `${pad(d.getHours())}:${pad(d.getMinutes())}`; };
let uid = 100; const nid = p => p + (++uid);

// ---------- sample data（範例資料）----------
const TYPES = ['Reformer 核心床','Mat 墊上','Chair 椅','Cadillac 塔床','孕期皮拉提斯'];
const COACHES = ['Vivian','Ken','Mia','Amber'];
const ROOMS = ['A 教室（器械）','B 教室（墊上）'];
const state = {
  user: null, role: null,
  memberTab: 'schedule', adminTab: 'dash', day: ymd(today),
  settings: { studio:'Core & Breath 皮拉提斯', cancelHours: 12, openDays: 14, waitlist: true, notifyLine: true },
  members: [
    { id:'m1', name:'林雅婷', provider:'LINE', phone:'0912-345-678', plan:'10 堂課卡', credits:6, expire:'2027-01-31', status:'active', joined:'2026-03-02' },
    { id:'m2', name:'陳怡君', provider:'Google', phone:'0933-222-111', plan:'20 堂課卡', credits:14, expire:'2027-03-15', status:'active', joined:'2026-05-18' },
    { id:'m3', name:'王志豪', provider:'LINE', phone:'0988-765-432', plan:'單堂', credits:1, expire:'2026-11-30', status:'active', joined:'2026-09-21' },
    { id:'m4', name:'張書瑜', provider:'Google', phone:'0921-555-090', plan:'月費無限', credits:99, expire:'2026-10-31', status:'active', joined:'2026-01-11' },
    { id:'m5', name:'黃柏翰', provider:'LINE', phone:'0956-100-200', plan:'10 堂課卡', credits:0, expire:'2026-12-20', status:'paused', joined:'2025-12-03' },
    { id:'m6', name:'吳佳穎', provider:'LINE', phone:'0910-880-660', plan:'10 堂課卡', credits:3, expire:'2026-11-10', status:'active', joined:'2026-07-07' },
  ],
  classes: []
};
(function seed(){
  const plan = [
    ['08:00',55,0,0,0,4],['10:00',55,1,1,1,8],['12:15',45,2,2,0,3],
    ['18:30',55,0,3,0,4],['19:45',55,1,0,1,8],['20:00',55,3,1,0,2]
  ];
  for (let i = 0; i < 7; i++) {
    const date = ymd(addDays(today, i));
    plan.forEach((p, j) => {
      if ((i + j) % 4 === 3) return; // 不是每天都排滿
      const [start,dur,t,co,r,cap] = p;
      const type = (i === 5 && j === 1) ? 4 : t;
      const others = ['m2','m3','m4','m6'];
      const n = Math.min(cap, (i*3 + j*5) % (cap + 1));
      const booked = others.slice(0, Math.min(n, others.length));
      while (booked.length < n) booked.push('guest' + booked.length);
      state.classes.push({ id:nid('c'), title:TYPES[type], coach:COACHES[(co+i)%4], room:ROOMS[r], date, start, dur, cap, booked, wait:[], note:'' });
    });
  }
  // 讓會員林雅婷已有兩筆預約
  const mine = state.classes.filter(c => c.booked.length < c.cap);
  [mine[2], mine[9]].forEach(c => c && c.booked.push('m1'));
})();
const memberName = id => (state.members.find(m => m.id === id) || {}).name || '現場會員';

// ---------- ui primitives ----------
function toast(msg){ const t = document.createElement('div'); t.className='toast'; t.textContent=msg; document.body.appendChild(t); setTimeout(()=>t.remove(), 2400); }
function modal(html, onMount){
  const layer = $('#layer');
  layer.innerHTML = `<div class="scrim"><div class="modal" role="dialog" aria-modal="true">${html}</div></div>`;
  const scrim = $('.scrim', layer);
  scrim.addEventListener('click', e => { if (e.target === scrim || e.target.closest('[data-close]')) close(); });
  function close(){ layer.innerHTML=''; }
  onMount && onMount($('.modal', layer), close);
}
function confirmBox(title, body, okText, fn, danger){
  modal(`<h3>${title}</h3><div>${body}</div><div class="acts"><button class="btn ghost" data-close>返回</button><button class="btn ${danger?'danger':'primary'}" id="ok">${okText}</button></div>`,
    (m, close) => $('#ok', m).onclick = () => { close(); fn(); });
}

// ---------- login & register ----------
const ICON_LINE = `<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 3C6.5 3 2 6.6 2 11c0 4 3.6 7.3 8.4 7.9.3.1.8.2.9.5.1.3.1.7 0 1l-.1.9c0 .3-.2 1 .9.5s5.9-3.5 8-5.9C21.5 14.3 22 12.7 22 11c0-4.4-4.5-8-10-8z"/></svg>`;
const ICON_G = `<svg viewBox="0 0 24 24"><path fill="#4285F4" d="M22.5 12.3c0-.8-.1-1.5-.2-2.3H12v4.3h5.9c-.3 1.4-1 2.5-2.2 3.3v2.8h3.6c2.1-1.9 3.2-4.8 3.2-8.1z"/><path fill="#34A853" d="M12 23c3 0 5.5-1 7.3-2.7l-3.6-2.8c-1 .7-2.2 1.1-3.7 1.1-2.9 0-5.3-1.9-6.2-4.5H2.1v2.9C3.9 20.6 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.8 14.1c-.2-.7-.4-1.4-.4-2.1s.1-1.4.4-2.1V7H2.1C1.4 8.5 1 10.2 1 12s.4 3.5 1.1 5l3.7-2.9z"/><path fill="#EA4335" d="M12 5.4c1.6 0 3.1.6 4.2 1.7l3.2-3.2C17.5 2.1 15 1 12 1 7.7 1 3.9 3.4 2.1 7l3.7 2.9c.9-2.6 3.3-4.5 6.2-4.5z"/></svg>`;

function renderLogin(){
  $('#root').innerHTML = `
  <div class="login">
    <div class="brand"><div class="mark">C</div><h1>${esc(state.settings.studio)}</h1><p class="muted">登入後即可查看課表、預約課程與管理堂數。</p></div>
    <div class="oauth">
      <button class="line" id="login-line">${ICON_LINE}使用 LINE 登入</button>
      <button id="login-google">${ICON_G}使用 Google 帳號登入</button>
    </div>
    <p class="small muted">第一次登入會請你填寫基本資料完成註冊。本系統不會取得你的 LINE 聊天內容或 Gmail 信件。</p>
    <button class="btn ghost sm" id="login-admin" style="justify-self:center">管理員登入</button>
  </div>`;
  $('#login-line').onclick = () => renderRegister('LINE');
  $('#login-google').onclick = () => renderRegister('Google');
  $('#login-admin').onclick = renderAdminLogin;
}
function renderRegister(provider){
  const pre = provider === 'LINE' ? { name:'林雅婷', email:'' } : { name:'Jason Lin', email:'jason@gmail.com' };
  $('#root').innerHTML = `
  <div class="login">
    <div class="brand"><span class="pill acc">${provider} 驗證成功</span><h1>完成會員註冊</h1><p class="muted">這些資料只需填寫一次，之後以 ${provider} 一鍵登入。</p></div>
    <form class="form" id="reg">
      <div class="field"><label for="r-name">姓名</label><input id="r-name" required value="${esc(pre.name)}"></div>
      <div class="field"><label for="r-phone">手機號碼</label><input id="r-phone" required inputmode="tel" placeholder="09xx-xxx-xxx" value="0912-345-678"></div>
      <div class="field"><label for="r-email">Email${provider==='Google'?'（由 Google 帶入）':'（選填）'}</label><input id="r-email" type="email" value="${esc(pre.email)}" ${provider==='Google'?'readonly':''}></div>
      <div class="field"><label for="r-health">身體狀況備註（選填，僅教練可見）</label><input id="r-health" placeholder="例：下背舊傷、懷孕 20 週"></div>
      <label class="check"><input type="checkbox" id="r-agree" required checked> 我已閱讀並同意上課須知與取消規則（開課前 ${state.settings.cancelHours} 小時內取消將扣除堂數）</label>
      <button class="btn primary" type="submit">完成註冊並進入</button>
      <button class="btn ghost" type="button" id="reg-back">返回</button>
    </form>
  </div>`;
  $('#reg-back').onclick = renderLogin;
  $('#reg').onsubmit = e => {
    e.preventDefault();
    const m = state.members[0];
    m.name = $('#r-name').value.trim() || m.name; m.phone = $('#r-phone').value; m.provider = provider;
    loginAs('member'); toast('註冊完成，歡迎加入！');
  };
}
function renderAdminLogin(){
  modal(`<h3>管理員登入</h3><p class="small muted">正式版建議：管理員同樣用 Google 登入，再由系統比對白名單 Email 授權後台權限。</p>
    <div class="oauth"><button id="adm-g">${ICON_G}以 Google 管理員帳號登入</button></div>
    <div class="acts"><button class="btn ghost" data-close>取消</button></div>`,
    (m, close) => $('#adm-g', m).onclick = () => { close(); loginAs('admin'); });
}
function loginAs(role){
  state.role = role;
  state.user = role === 'member' ? state.members[0] : { name:'管理員 Vivian' };
  $('#whoami').textContent = role === 'member' ? `會員 ${state.user.name}` : state.user.name;
  render();
}

// ---------- member side ----------
function classStatus(c, mid){
  const now = new Date();
  if (startOf(c) < now) return 'past';
  if (c.booked.includes(mid)) return 'booked';
  if (c.wait.includes(mid)) return 'waiting';
  if (c.booked.length >= c.cap) return 'full';
  return 'open';
}
function seats(c){ return `<div class="seats" aria-label="已預約 ${c.booked.length} / ${c.cap}">${Array.from({length:c.cap},(_,i)=>`<i class="${i<c.booked.length?'f':''}"></i>`).join('')}</div>`; }

function renderMember(){
  const u = state.user;
  const tab = state.memberTab;
  let body = '';
  if (tab === 'schedule') {
    const days = Array.from({length:7}, (_,i)=>addDays(today,i));
    const list = state.classes.filter(c => c.date === state.day).sort((a,b)=>a.start.localeCompare(b.start));
    body = `
      <div class="days">${days.map(d=>{const k=ymd(d);return `<button class="day ${k===state.day?'on':''}" data-day="${k}"><div class="small">${k===ymd(today)?'今天':'週'+WD[d.getDay()]}</div><div class="d">${d.getDate()}</div></button>`}).join('')}</div>
      <div class="list">${list.length ? list.map(c => {
        const st = classStatus(c, u.id);
        const left = c.cap - c.booked.length;
        const btn = {
          open:`<button class="btn primary sm" data-book="${c.id}">預約</button>`,
          booked:`<button class="btn sm" data-cancel="${c.id}">取消預約</button>`,
          full: state.settings.waitlist ? `<button class="btn sm" data-wait="${c.id}">候補</button>` : `<span class="pill bad">額滿</span>`,

  } else if (tab === 'mine') {

    body = `<div class="sec"><h2 style="font-size:20px">我的預約</h2>

        ${c.wait.includes(u.id)?`<span class="pill warn">候補第 ${c.wait.indexOf(u.id)+1} 位</span>`:'<span class="pill ok">已預約</span>'}</div>
        <div>${c.wait.includes(u.id)?`<button class="btn sm" data-unwait="${c.id}">取消候補</button>`:`<button class="btn sm" data-cancel="${c.id}">取消</button>`}</div></div>`).join('')
        : `<div class="empty">目前沒有預約。到「課表」挑一堂課吧。</div>`}
      <p class="small muted">開課前 ${state.settings.cancelHours} 小時以上取消會退回堂數；${state.settings.cancelHours} 小時內取消將扣除 1 堂。</p></div>`;
  } else {

      <div class="card kv"><span class="muted">姓名</span><span>${esc(u.name)}</span><span class="muted">登入方式</span><span>${u.provider}</span>
        <span class="muted">手機</span><span class="num">${esc(u.phone)}</span><span class="muted">方案</span><span>${esc(u.plan)}</span>
        <span class="muted">剩餘堂數</span><span class="num">${u.credits} 堂</span><span class="muted">到期日</span><span class="num">${u.expire}</span></div>
      <div class="card"><div class="label">通知</div><p style="margin:6px 0 0">預約成功、候補遞補、開課前一天提醒，會透過 LINE 官方帳號通知你。</p></div>
      <button class="btn ghost" id="logout">登出</button></div>`;
  }
  $('#root').innerHTML = `<div class="app">

}
function book(id){
  const c = state.classes.find(x=>x.id===id), u = state.user;
  if (u.credits <= 0) return toast('堂數不足，請洽櫃台購買課卡');
  confirmBox('確認預約', `<p style="margin:0"><b>${esc(c.title)}</b><br>${fmtDate(c.date)} ${c.start}–${endTime(c)}・${esc(c.coach)} 老師</p><p class="small muted">將使用 1 堂，剩餘 ${u.credits-1} 堂。</p>`, '確認預約', () => {
    c.booked.push(u.id); u.credits--; render(); toast('預約成功，已傳送 LINE 通知');
  });
}
function cancel(id){
  const c = state.classes.find(x=>x.id===id), u = state.user;
  const hrs = (startOf(c) - new Date())/36e5, late = hrs < state.settings.cancelHours;
  confirmBox('取消預約', `<p style="margin:0">${esc(c.title)}・${fmtDate(c.date)} ${c.start}</p><p class="small ${late?'':'muted'}" style="${late?'color:var(--bad)':''}">${late?`距開課不到 ${state.settings.cancelHours} 小時，取消後不退還堂數。`:'取消後將退回 1 堂。'}</p>`, '確認取消', () => {
    c.booked = c.booked.filter(x=>x!==u.id); if (!late) u.credits++;
    promote(c); render(); toast('已取消預約');
  }, true);
}
function promote(c){ // 候補自動遞補
  while (c.wait.length && c.booked.length < c.cap) { const m = c.wait.shift(); c.booked.push(m); const mm = state.members.find(x=>x.id===m); if (mm) mm.credits--; }
}

// ---------- render & events ----------
function render(){
  if (!state.role) return renderLogin();
  state.role === 'member' ? renderMember() : renderAdmin();
}
document.addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  const d = b.dataset;
  if (d.day) { state.day = d.day; render(); }
  else if (d.mtab) { state.memberTab = d.mtab; render(); }
  else if (d.atab) { state.adminTab = d.atab; render(); }
  else if (d.book) book(d.book);
  else if (d.cancel) cancel(d.cancel);
  else if (d.wait) { state.classes.find(c=>c.id===d.wait).wait.push(state.user.id); render(); toast('已加入候補，有空位會以 LINE 通知你'); }
  else if (d.unwait) { const c = state.classes.find(c=>c.id===d.unwait); c.wait = c.wait.filter(x=>x!==state.user.id); render(); toast('已取消候補'); }
  else if (d.roster) roster(d.roster);
  else if ('edit' in d) editClass(d.edit);
  else if (d.del) { const c = state.classes.find(x=>x.id===d.del);
    confirmBox('刪除課程', `<p style="margin:0">${esc(c.title)}・${fmtDate(c.date)} ${c.start}</p><p class="small muted">已預約的 ${c.booked.filter(m=>!m.startsWith('guest')).length} 位會員會退回堂數並收到停課通知。</p>`, '刪除', () => {
      c.booked.forEach(m=>{const mm=state.members.find(x=>x.id===m); if(mm) mm.credits++;}); state.classes = state.classes.filter(x=>x!==c); render(); toast('課程已刪除');
    }, true); }
  else if (d.cr) { const [id,n] = d.cr.split('|'); const m = state.members.find(x=>x.id===id); m.credits = Math.max(0, m.credits + +n); render(); }
  else if (d.plan) topUp(d.plan);
  else if (d.toggle) { const m = state.members.find(x=>x.id===d.toggle); m.status = m.status==='active'?'paused':'active'; render(); }
  else if (d.acancel) { const [cid,mid] = d.acancel.split('|'); const c = state.classes.find(x=>x.id===cid);
    confirmBox('代為取消', `<p style="margin:0">取消 ${esc(memberName(mid))} 的「${esc(c.title)}」預約，並退回 1 堂？</p>`, '確認取消', () => {
      if (c.booked.includes(mid)) { c.booked = c.booked.filter(x=>x!==mid); const mm=state.members.find(x=>x.id===mid); if(mm) mm.credits++; promote(c); }
      else c.wait = c.wait.filter(x=>x!==mid);
      render(); toast('已取消並通知會員');
    }, true); }
  else if (b.id === 'logout' || b.id === 'demo-reset') { state.role = null; state.user = null; $('#whoami').textContent='未登入'; render(); }
  else if (b.id === 'demo-member') loginAs('member');
  else if (b.id === 'demo-admin') loginAs('admin');
});
document.addEventListener('change', e => {
  if (e.target.id === 'cls-filter') { state.classFilter = e.target.value; render(); }
});
document.addEventListener('input', e => {
  if (e.target.id === 'mem-q') { state.memberQ = e.target.value; render(); const i = $('#mem-q'); i.focus(); i.setSelectionRange(i.value.length, i.value.length); }
});
document.addEventListener('submit', e => {
  if (e.target.id === 'sf') { e.preventDefault(); const s = state.settings;
    s.studio = $('#s-name').value; s.cancelHours = +$('#s-cancel').value; s.openDays = +$('#s-open').value; s.waitlist = $('#s-wait').checked; s.notifyLine = $('#s-line').checked;
    render(); toast('設定已儲存'); }
});
render();
</script>

</body>
