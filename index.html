<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>皮拉提斯排課表</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600;700&display=swap">
<style>
/* Layout: top toolbar + resource calendar (one lane per coach) as the working surface; member and settings views share the same frame */
:root{
  --bg:#F3F4F1; --surface:#FFFFFF; --sunk:#E9ECE7; --line:#D7DCD5; --grid-soft:#EDF0EB;
  --ink:#1C2422; --muted:#5D6965; --accent:#2E5E54; --accent-ink:#FFFFFF; --accent-soft:#DCE8E3;
  --ok:#2F7A4B; --warn:#9C6410; --bad:#B23B3B;
  --c0:#2E7D6B; --c1:#8A4F9E; --c2:#B07A12; --c3:#2F6DB5; --c4:#C0506A; --c5:#5F7A2A;
  --f-display:"Noto Serif TC","Songti TC",serif;
  --f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --r:10px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#131816; --surface:#1B211F; --sunk:#232A27; --line:#323C38; --grid-soft:#252D2A;
  --ink:#E5ECE9; --muted:#98A6A1; --accent:#7FB8A8; --accent-ink:#0F1A17; --accent-soft:#24362F;
  --ok:#6CC58F; --warn:#E0A84A; --bad:#E57A7A;
  --c0:#5CC3AA; --c1:#C38FD6; --c2:#E2B14E; --c3:#7AAEF0; --c4:#EB8AA0; --c5:#A8C46A; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#131816; --surface:#1B211F; --sunk:#232A27; --line:#323C38; --grid-soft:#252D2A;
  --ink:#E5ECE9; --muted:#98A6A1; --accent:#7FB8A8; --accent-ink:#0F1A17; --accent-soft:#24362F;
  --ok:#6CC58F; --warn:#E0A84A; --bad:#E57A7A;
  --c0:#5CC3AA; --c1:#C38FD6; --c2:#E2B14E; --c3:#7AAEF0; --c4:#EB8AA0; --c5:#A8C46A; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.55}
h1,h2,h3{font-family:var(--f-display);font-weight:700;margin:0;line-height:1.3;text-wrap:balance}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:12.5px}
.label{font-size:12px;letter-spacing:.08em;color:var(--muted)}

.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 14px;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 50%,transparent);background:transparent}
.btn.sm{padding:3px 10px;font-size:13px}
.btn.icon{padding:6px 10px;min-width:34px}
.pill{display:inline-block;font-size:12px;padding:1px 9px;border-radius:999px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.pill.ok{background:color-mix(in srgb,var(--ok) 15%,transparent);color:var(--ok)}
.pill.warn{background:color-mix(in srgb,var(--warn) 16%,transparent);color:var(--warn)}
.pill.bad{background:color-mix(in srgb,var(--bad) 14%,transparent);color:var(--bad)}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--cc);flex:0 0 auto}

/* top bar */
.top{display:flex;align-items:center;gap:12px 20px;flex-wrap:wrap;padding:12px 16px;background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);z-index:10}
.brand{display:flex;flex-direction:column;line-height:1.2;margin-right:auto}
.brand h1{font-size:18px}
.seg{display:inline-flex;background:var(--sunk);border-radius:9px;padding:3px}
.seg button{border:0;background:none;padding:5px 14px;border-radius:7px;color:var(--muted);font-weight:500}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px color-mix(in srgb,var(--ink) 15%,transparent)}
.bar{display:flex;align-items:center;gap:10px 16px;flex-wrap:wrap;padding:10px 16px}
.datenav{display:flex;align-items:center;gap:6px}
.datenav h2{font-size:18px;min-width:9.5em}
.datenav input[type=date]{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:5px 8px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:3px 11px 3px 9px;font-size:13px}
.chip.off{opacity:.45}
.chip.off .dot{background:transparent;border:1.5px solid var(--cc)}
.focus{display:flex;align-items:center;gap:6px;margin-left:auto}
.focus select{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:5px 8px;max-width:180px}
.banner{margin:0 16px 10px;padding:8px 14px;border-radius:8px;background:var(--accent-soft);display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:13px}
.focusinfo{margin:0 16px 10px;font-size:13px}

/* calendar */
.cal-wrap{margin:0 16px 32px;overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.cal{display:grid;position:relative}
.cal .head{position:sticky;top:0;background:var(--surface);border-bottom:1px solid var(--line);padding:8px 10px;display:flex;align-items:center;gap:8px;z-index:3;min-width:0}
.cal .head .n{margin-left:auto}
.cal .head.today{color:var(--accent)}
.cal .head button.dhead{border:0;background:none;padding:0;text-align:left;display:flex;flex-direction:column;line-height:1.25}
.cal .head .wd{font-size:12px;color:var(--muted)}
.cal .head .dd{font-size:17px;font-weight:700;font-variant-numeric:tabular-nums}
.cal .head.today .dd,.cal .head.today .wd{color:var(--accent)}
.times{position:relative;border-right:1px solid var(--line)}
.times span{position:absolute;right:8px;transform:translateY(-50%);font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.times span:first-child{transform:translateY(2px)}
.lane{position:relative;border-right:1px solid var(--grid-soft);cursor:copy;
  background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(var(--grid-soft) 1px,transparent 1px);
  background-size:100% var(--hour),100% calc(var(--hour) / 2)}
.lane:last-child{border-right:0}
.lane.today{background-color:color-mix(in srgb,var(--accent-soft) 35%,transparent)}
.lane:hover{background-color:color-mix(in srgb,var(--accent-soft) 45%,transparent)}
.nowline{position:absolute;left:0;right:0;height:2px;background:var(--bad);z-index:2;pointer-events:none}
.nowline::before{content:"";position:absolute;left:-4px;top:-3px;width:8px;height:8px;border-radius:50%;background:var(--bad)}
.blk{position:absolute;container-type:inline-size;overflow:hidden;text-align:left;cursor:pointer;
  background:color-mix(in srgb,var(--cc) 15%,var(--surface));border:1px solid color-mix(in srgb,var(--cc) 50%,transparent);
  border-radius:6px;padding:3px 6px;display:flex;flex-direction:column;gap:0;line-height:1.3;z-index:1}
.blk:hover{background:color-mix(in srgb,var(--cc) 24%,var(--surface));z-index:4}
.b-time{font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.b-names{font-weight:700;font-size:13px;overflow:hidden;text-overflow:ellipsis}
.b-meta{font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.b-st{position:absolute;top:3px;right:4px;font-size:11px;padding:0 6px;border-radius:999px;background:var(--surface);color:var(--muted)}
.blk.st-done .b-st{color:var(--ok)}
.blk.st-leave,.blk.st-noshow{background:repeating-linear-gradient(135deg,var(--sunk) 0 6px,var(--surface) 6px 12px);border-style:dashed}
.blk.st-leave .b-names,.blk.st-noshow .b-names{text-decoration:line-through;color:var(--muted)}
.blk.st-noshow .b-st{color:var(--bad)}
.blk.dim{opacity:.22}
.blk.hit{box-shadow:0 0 0 2px var(--cc);z-index:3}
@container (max-width:84px){.b-meta,.b-st{display:none}.b-names{font-size:12px}}
.empty{padding:40px 16px;text-align:center;color:var(--muted)}

/* member view */
.mview{display:grid;grid-template-columns:280px 1fr;gap:16px;padding:12px 16px 40px;align-items:start}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);min-width:0}
.mlist .tools{display:flex;gap:8px;padding:12px;border-bottom:1px solid var(--line)}
.mlist input{flex:1;min-width:0;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:6px 10px}
.mlist ul{list-style:none;margin:0;padding:6px;max-height:calc(100vh - 220px);overflow:auto}
.mlist li button{width:100%;display:flex;justify-content:space-between;align-items:center;gap:8px;border:0;background:none;padding:8px 10px;border-radius:7px;text-align:left}
.mlist li button.on{background:var(--accent-soft)}
.mdetail{padding:20px;display:grid;gap:20px}
.mhead{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap}
.mhead h2{font-size:24px}
.credit{display:flex;gap:24px;flex-wrap:wrap}
.credit div{display:flex;flex-direction:column}
.credit .v{font-family:var(--f-display);font-size:28px;line-height:1.15}
.credit .v.low{color:var(--warn)}
.credit .v.zero{color:var(--bad)}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:12px;letter-spacing:.06em;color:var(--muted);font-weight:500}
tr:last-child td{border-bottom:0}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--sunk)}
.sec-title{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px}
.sec-title h3{font-size:16px}

/* settings */
.settings{padding:12px 16px 40px;display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px;align-items:start}
.settings .panel{padding:16px;display:grid;gap:12px}
.rowlist{display:grid;gap:8px}
.srow{display:flex;gap:8px;align-items:center}
.srow input,.srow select{border:1px solid var(--line);background:var(--bg);border-radius:7px;padding:5px 8px;min-width:0}
.srow input.grow{flex:1}
.srow input.n{width:64px}

/* forms & modal */
.form{display:grid;gap:12px}
.field{display:grid;gap:4px;min-width:0}
.field label{font-size:13px;color:var(--muted)}
.field input,.field select,.field textarea{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 10px;width:100%}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.mchips{display:flex;gap:6px;flex-wrap:wrap}
.mchip{display:inline-flex;align-items:center;gap:4px;background:var(--accent-soft);color:var(--ink);border-radius:999px;padding:2px 4px 2px 10px;font-size:13px}
.mchip button{border:0;background:none;width:20px;height:20px;border-radius:50%;padding:0;line-height:1;color:var(--muted)}
.addrow{display:flex;gap:8px}
.addrow select,.addrow input{flex:1;min-width:0;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 10px}
.warns{display:grid;gap:4px;padding:10px 12px;border-radius:8px;background:color-mix(in srgb,var(--warn) 12%,transparent);color:var(--warn);font-size:13px}
.warns.ok{background:color-mix(in srgb,var(--ok) 10%,transparent);color:var(--ok)}
.scrim{position:fixed;inset:0;background:color-mix(in srgb,#000 45%,transparent);display:grid;place-items:center;padding:16px;z-index:20}
.modal{background:var(--surface);border-radius:14px;padding:20px;width:100%;max-width:520px;display:grid;gap:14px;max-height:92vh;overflow:auto}
.modal .acts{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}
.modal .acts .left{margin-right:auto;display:flex;gap:8px;flex-wrap:wrap}
.modal textarea.mono{font-family:ui-monospace,Menlo,monospace;font-size:12px;height:160px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 18px;border-radius:999px;font-size:14px;z-index:30;max-width:calc(100% - 32px)}

@media (max-width:760px){
  .mview{grid-template-columns:1fr}
  .mlist ul{max-height:240px}
  .focus{margin-left:0}
  .grid3{grid-template-columns:1fr 1fr}
  .datenav h2{min-width:0;font-size:16px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div id="root"></div>
<div id="layer"></div>

<script>
// ===== helpers =====
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2,'0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parse = s => new Date(s + 'T00:00');
const addDays = (d,n) => { const x = new Date(d); x.setDate(x.getDate()+n); return x; };
const WD = ['日','一','二','三','四','五','六'];
const toMin = t => { const [h,m] = t.split(':').map(Number); return h*60+m; };
const fromMin = m => `${pad(Math.floor(m/60))}:${pad(m%60)}`;
const endOf = b => fromMin(toMin(b.start) + b.dur);
const wkStart = d => addDays(d, -((d.getDay()+6)%7));
const fmtMD = s => { const d = parse(s); return `${d.getMonth()+1}/${d.getDate()}（${WD[d.getDay()]}）`; };
const uid = p => p + Math.random().toString(36).slice(2,9);
const TODAY = (() => { const d = new Date(); d.setHours(0,0,0,0); return d; })();
const STATUS = {
  booked:{label:'已預約', charge:true},
  done:{label:'已到課', charge:true},
  leave:{label:'請假', charge:false},
  noshow:{label:'缺席', charge:true}
};

// ===== data =====
const KEY = 'pilates-schedule-v2';
function load(){ try { const s = localStorage.getItem(KEY); return s ? JSON.parse(s) : null; } catch(e){ return null; } }
function save(){ try { localStorage.setItem(KEY, JSON.stringify(db)); } catch(e){} }

function seed(){
  const coaches = [{id:'k1',name:'Vivian',color:0},{id:'k2',name:'Ken',color:3},{id:'k3',name:'Mia',color:1},{id:'k4',name:'Amber',color:2}];
  const rooms = [{id:'r1',name:'Reformer A'},{id:'r2',name:'Reformer B'},{id:'r3',name:'Cadillac 塔床'},{id:'r4',name:'墊上教室'}];
  const types = [{id:'t1',name:'私人課',dur:55,cap:1},{id:'t2',name:'雙人課',dur:55,cap:2},{id:'t3',name:'小團體',dur:55,cap:4},{id:'t4',name:'孕期私人課',dur:55,cap:1},{id:'t5',name:'體驗課',dur:60,cap:1}];
  const names = ['林雅婷','陳怡君','王志豪','張書瑜','黃柏翰','吳佳穎','李宜蓁','周品妤','許家豪','蔡沛恩','鄭雅文','劉思妤'];
  const phones = ['0912-345-678','0933-222-111','0988-765-432','0921-555-090','0956-100-200','0910-880-660','0937-414-202','0975-303-818','0922-610-447','0919-276-530','0963-158-902','0928-731-064'];
  const notes = ['下背舊傷，避免深度前彎','','','孕期 22 週','膝蓋術後復健','','','肩頸緊繃','','','',''];
  const members = names.map((n,i)=>({id:'m'+(i+1), name:n, phone:phones[i], note:notes[i], packages:[]}));
  const slots = { k1:['09:00','10:00','18:30','19:30'], k2:['07:30','12:00','19:00','20:00'], k3:['10:30','14:00','17:30','18:30'], k4:['09:30','11:00','19:00','20:00'] };
  const roomOf = { k1:'r1', k2:'r2', k3:'r3', k4:'r4' };
  const bookings = [];
  const ws = wkStart(TODAY), now = new Date();
  let ptr = 0, n = 0;
  for (let d = 0; d < 14; d++) {
    if (d % 7 === 6) continue; // 週日公休
    const date = ymd(addDays(ws, d));
    coaches.forEach((c, ki) => slots[c.id].forEach((start, si) => {
      if ((d*31 + ki*17 + si*7) % 5 === 0) return;
      if (d % 7 === 5 && toMin(start) > 13*60) return; // 週六只上早上
      const isGroup = c.id === 'k4' && start === '19:00';
      const isDuo = !isGroup && (d + ki + si) % 6 === 0;
      const want = isGroup ? 3 + (d % 2) : isDuo ? 2 : 1;
      const s = toMin(start), e = s + 55;
      const busy = new Set(bookings.filter(b => b.date === date && toMin(b.start) < e && s < toMin(b.start) + b.dur).flatMap(b => b.memberIds));
      const ids = [];
      for (let tries = 0; ids.length < want && tries < 24; tries++) { const m = members[ptr++ % members.length]; if (!busy.has(m.id) && !ids.includes(m.id)) ids.push(m.id); }
      if (!ids.length) return;
      let typeId = isGroup ? 't3' : isDuo ? 't2' : 't1';
      if (ids.includes('m4') && !isGroup && !isDuo) typeId = 't4';
      const past = new Date(`${date}T${start}`) < now;
      n++;
      const status = !past ? 'booked' : n % 11 === 0 ? 'leave' : n % 29 === 0 ? 'noshow' : 'done';
      bookings.push({ id:uid('b'), date, start, dur:55, coachId:c.id, roomId:roomOf[c.id], typeId, memberIds:ids, status, note:'' });
    }));
  }
  const extra = [6,2,9,0,1,4,7,3,5,8,1,6];
  members.forEach((m,i) => {
    const used = bookings.filter(b => b.memberIds.includes(m.id) && STATUS[b.status].charge).length;
    m.packages.push({ id:uid('p'), date: ymd(addDays(TODAY, -20 - i*4)), count: used + extra[i], note:'課卡（範例）' });
  });
  return { sample:true, settings:{ studio:'Core & Breath 皮拉提斯', open:'07:00', close:'22:00' }, coaches, rooms, types, members, bookings };
}

let db = load() || seed();
const ui = { view:'day', date: ymd(TODAY), hidden:new Set(), focus:'', mq:'', mSel:null };

const coachOf = id => db.coaches.find(c => c.id === id);
const roomOf = id => db.rooms.find(r => r.id === id);
const typeOf = id => db.types.find(t => t.id === id);
const memberOf = id => db.members.find(m => m.id === id);
const mName = id => memberOf(id)?.name || '（已刪除會員）';
function credits(m){
  const bought = m.packages.reduce((s,p) => s + Number(p.count||0), 0);
  const used = db.bookings.filter(b => b.memberIds.includes(m.id) && STATUS[b.status].charge).length;
  const upcoming = db.bookings.filter(b => b.memberIds.includes(m.id) && b.status === 'booked' && new Date(`${b.date}T${b.start}`) >= new Date()).length;
  return { bought, used, left: bought - used, upcoming };
}
function conflicts(b, ignoreIds){
  const s = toMin(b.start), e = s + Number(b.dur);
  const out = [];
  db.bookings.forEach(o => {
    if (ignoreIds.includes(o.id) || o.date !== b.date || o.status === 'leave') return;
    const os = toMin(o.start), oe = os + o.dur;
    if (!(s < oe && os < e)) return;
    const when = `${fmtMD(o.date)} ${o.start}`;
    if (o.coachId === b.coachId) out.push(`${coachOf(o.coachId)?.name} 在 ${when} 已有課（${o.memberIds.map(mName).join('、')}）`);
    else if (o.roomId === b.roomId) out.push(`${roomOf(o.roomId)?.name} 在 ${when} 已被 ${coachOf(o.coachId)?.name} 使用`);
    b.memberIds.filter(id => o.memberIds.includes(id)).forEach(id => out.push(`${mName(id)} 在 ${when} 已有其他課程`));
  });
  return out;
}

// ===== ui primitives =====
function toast(msg){ const t = document.createElement('div'); t.className='toast'; t.textContent=msg; document.body.appendChild(t); setTimeout(()=>t.remove(), 2400); }
function modal(html, onMount){
  const layer = $('#layer');
  layer.innerHTML = `<div class="scrim"><div class="modal" role="dialog" aria-modal="true">${html}</div></div>`;
  const scrim = $('.scrim', layer);
  const close = () => { layer.innerHTML = ''; document.removeEventListener('keydown', onKey); };
  const onKey = e => { if (e.key === 'Escape') close(); };
  document.addEventListener('keydown', onKey);
  scrim.addEventListener('click', e => { if (e.target === scrim || e.target.closest('[data-close]')) close(); });
  onMount && onMount($('.modal', layer), close);
}
function confirmBox(title, body, okText, fn){
  modal(`<h3>${title}</h3><div>${body}</div><div class="acts"><button class="btn" data-close>返回</button><button class="btn danger" id="ok">${okText}</button></div>`,
    (m, close) => $('#ok', m).onclick = () => { close(); fn(); });
}
function commit(msg){ save(); render(); if (msg) toast(msg); }

// ===== render: shell =====
function render(){
  const v = ui.view;
  $('#root').innerHTML = `
    <header class="top">
      <div class="brand"><span class="label">${esc(db.settings.studio)}</span><h1>排課表</h1></div>
      <div class="seg" role="tablist">${[['day','日'],['week','週'],['members','會員'],['settings','設定']].map(([k,l])=>`<button class="${v===k?'on':''}" data-view="${k}">${l}</button>`).join('')}</div>
      <button class="btn primary" data-new="1">＋ 新增預約</button>
    </header>
    ${db.sample ? `<div class="banner" style="margin-top:10px">目前是範例資料，可以隨意操作。正式使用前請清除範例。<button class="btn sm" id="clear-sample">清除範例資料</button></div>` : ''}
    ${v==='day'||v==='week' ? calendarView() : v==='members' ? memberView() : settingsView()}`;
}

// ===== calendar =====
const PX = 1.15; // px per minute
function visibleCoaches(){ return db.coaches.filter(c => !ui.hidden.has(c.id)); }
function calendarView(){
  const isDay = ui.view === 'day';
  const d = parse(ui.date);
  const ws = wkStart(d);
  const label = isDay ? `${d.getMonth()+1} 月 ${d.getDate()} 日・週${WD[d.getDay()]}` : `${ws.getMonth()+1}/${ws.getDate()} – ${addDays(ws,6).getMonth()+1}/${addDays(ws,6).getDate()}`;
  const focusM = ui.focus && memberOf(ui.focus);
  let focusInfo = '';
  if (focusM) {
    const cr = credits(focusM);
    const range = isDay ? [ui.date] : Array.from({length:7},(_,i)=>ymd(addDays(ws,i)));
    const cnt = db.bookings.filter(b => range.includes(b.date) && b.memberIds.includes(focusM.id)).length;
    focusInfo = `<div class="focusinfo"><b>${esc(focusM.name)}</b>：${isDay?'今天':'本週'} ${cnt} 堂・剩餘 <b class="num">${cr.left}</b> 堂・之後已預約 ${cr.upcoming} 堂　<button class="btn sm" data-new="1" data-nm="${focusM.id}">為她/他新增預約</button> <button class="btn sm" data-mopen="${focusM.id}">查看會員</button></div>`;
  }
  return `
    <div class="bar">
      <div class="datenav">
        <button class="btn icon" data-shift="-1" aria-label="上一${isDay?'天':'週'}">‹</button>
        <button class="btn" data-today="1">今天</button>
        <button class="btn icon" data-shift="1" aria-label="下一${isDay?'天':'週'}">›</button>
        <h2 class="num">${label}</h2>
        <input type="date" id="jump" value="${ui.date}" aria-label="跳到日期">
      </div>
      <div class="chips" aria-label="顯示的教練">${db.coaches.map(c=>`<button class="chip ${ui.hidden.has(c.id)?'off':''}" data-coach="${c.id}" style="--cc:var(--c${c.color})"><span class="dot"></span>${esc(c.name)}</button>`).join('')}</div>
      <div class="focus"><label for="focus" class="small muted">標示會員</label>
        <select id="focus"><option value="">全部</option>${db.members.map(m=>`<option value="${m.id}" ${m.id===ui.focus?'selected':''}>${esc(m.name)}</option>`).join('')}</select></div>
    </div>
    ${focusInfo}
    ${!db.coaches.length ? `<div class="cal-wrap"><div class="empty">還沒有教練。請到「設定」新增教練後開始排課。</div></div>` : isDay ? dayGrid() : weekGrid(ws)}`;
}
function hourMarks(open, close, H){
  let s = '';
  for (let m = Math.ceil(open/60)*60; m <= close; m += 60) s += `<span style="top:${(m-open)*PX}px">${fromMin(m)}</span>`;
  return `<div class="times" style="height:${H}px">${s}</div>`;
}
function nowLine(date, open, close){
  if (date !== ymd(TODAY)) return '';
  const n = new Date(), m = n.getHours()*60 + n.getMinutes();
  if (m < open || m > close) return '';
  return `<div class="nowline" style="top:${(m-open)*PX}px"></div>`;
}
function blockHTML(b, open, style, withCoach){
  const c = coachOf(b.coachId), t = typeOf(b.typeId), r = roomOf(b.roomId);
  const names = b.memberIds.map(mName).join('、') || '（未指定會員）';
  const dim = ui.focus && !b.memberIds.includes(ui.focus);
  const hit = ui.focus && !dim;
  const top = (toMin(b.start) - open) * PX, h = Math.max(b.dur * PX - 2, 20);
  const meta = [withCoach ? c?.name : null, t?.name, r?.name].filter(Boolean).join('・');
  return `<button class="blk st-${b.status} ${dim?'dim':''} ${hit?'hit':''}" data-bk="${b.id}"
    style="top:${top}px;height:${h}px;${style};--cc:var(--c${c?.color ?? 0})"
    title="${esc(`${b.start}–${endOf(b)} ${names}\n${meta}${b.note ? '\n備註：'+b.note : ''}`)}">
    <span class="b-time">${b.start}–${endOf(b)}</span><span class="b-names">${esc(names)}</span><span class="b-meta">${esc(meta)}</span>
    ${b.status!=='booked'?`<span class="b-st">${STATUS[b.status].label}</span>`:''}</button>`;
}
function dayGrid(){
  const open = toMin(db.settings.open), close = toMin(db.settings.close), H = (close-open)*PX;
  const cs = visibleCoaches();
  if (!cs.length) return `<div class="cal-wrap"><div class="empty">所有教練都被隱藏了，點上方教練名稱即可顯示。</div></div>`;
  const today = ui.date === ymd(TODAY);
  const heads = cs.map(c => {
    const n = db.bookings.filter(b => b.date===ui.date && b.coachId===c.id && b.status!=='leave').length;
    return `<div class="head" style="--cc:var(--c${c.color})"><span class="dot"></span><b>${esc(c.name)}</b><span class="n small muted num">${n} 堂</span></div>`;
  }).join('');
  const lanes = cs.map(c => {
    const list = db.bookings.filter(b => b.date===ui.date && b.coachId===c.id).sort((a,b)=>a.start.localeCompare(b.start));
    return `<div class="lane ${today?'today':''}" data-ld="${ui.date}" data-lc="${c.id}" style="height:${H}px;--hour:${60*PX}px">${list.map(b=>blockHTML(b, open, 'left:3px;right:3px', false)).join('')}${nowLine(ui.date, open, close)}</div>`;
  }).join('');
  return `<div class="cal-wrap"><div class="cal" style="grid-template-columns:56px repeat(${cs.length},minmax(150px,1fr))"><div class="head"></div>${heads}${hourMarks(open,close,H)}${lanes}</div></div>`;
}
function layout(list){
  const res = []; let cluster = [], end = -1;
  const flush = () => { const cols = []; cluster.forEach(it => { let i = cols.findIndex(e => e <= it.s); if (i < 0) { i = cols.length; cols.push(0); } cols[i] = it.e; it.col = i; }); cluster.forEach(it => it.n = cols.length); res.push(...cluster); cluster = []; end = -1; };
  list.forEach(b => { const s = toMin(b.start), e = s + b.dur; if (cluster.length && s >= end) flush(); cluster.push({b,s,e}); end = Math.max(end, e); });
  if (cluster.length) flush();
  return res;
}
function weekGrid(ws){
  const open = toMin(db.settings.open), close = toMin(db.settings.close), H = (close-open)*PX;
  const show = new Set(visibleCoaches().map(c=>c.id));
  const days = Array.from({length:7},(_,i)=>ymd(addDays(ws,i)));
  const heads = days.map(ds => {
    const d = parse(ds), n = db.bookings.filter(b=>b.date===ds && show.has(b.coachId) && b.status!=='leave').length;
    return `<div class="head ${ds===ymd(TODAY)?'today':''}"><button class="dhead" data-goday="${ds}" title="切換到日檢視"><span class="wd">週${WD[d.getDay()]}</span><span class="dd">${d.getMonth()+1}/${d.getDate()}</span></button><span class="n small muted num">${n} 堂</span></div>`;
  }).join('');
  const cols = days.map(ds => {
    const list = db.bookings.filter(b => b.date===ds && show.has(b.coachId)).sort((a,b)=>a.start.localeCompare(b.start) || a.coachId.localeCompare(b.coachId));
    const blocks = layout(list).map(it => { const w = 100/it.n; return blockHTML(it.b, open, `left:calc(${it.col*w}% + 2px);width:calc(${w}% - 4px)`, true); }).join('');
    return `<div class="lane ${ds===ymd(TODAY)?'today':''}" data-ld="${ds}" style="height:${H}px;--hour:${60*PX}px">${blocks}${nowLine(ds, open, close)}</div>`;
  }).join('');
  return `<div class="cal-wrap"><div class="cal" style="grid-template-columns:56px repeat(7,minmax(150px,1fr))"><div class="head"></div>${heads}${hourMarks(open,close,H)}${cols}</div></div>`;
}

// ===== booking editor =====
function openBooking(opts = {}){
  const ex = opts.id ? db.bookings.find(b => b.id === opts.id) : null;
  const t0 = db.types[0];
  const d = ex ? JSON.parse(JSON.stringify(ex)) : {
    date: opts.date || ui.date, start: opts.start || '10:00', dur: t0?.dur || 55,
    coachId: opts.coachId || visibleCoaches()[0]?.id || db.coaches[0]?.id, roomId: db.rooms[0]?.id, typeId: t0?.id,
    memberIds: opts.memberIds || [], status:'booked', note:''
  };
  if (!ex && opts.coachId) { // 沿用該教練最常用的教室
    const last = db.bookings.filter(b => b.coachId === opts.coachId).at(-1); if (last) d.roomId = last.roomId;
  }
  const opt = (arr, v) => arr.map(a => `<option value="${a.id}" ${a.id===v?'selected':''}>${esc(a.name)}</option>`).join('');
  modal(`
    <h3>${ex ? '編輯預約' : '新增預約'}</h3>
    <form class="form" id="bf">
      <div class="field"><label>會員</label>
        <div class="mchips" id="b-mchips"></div>
        <div class="addrow"><select id="b-madd" aria-label="加入會員"></select></div>
        <div class="addrow"><input id="b-mnew" placeholder="新會員？輸入姓名後按「建立」"><button type="button" class="btn sm" id="b-mnew-btn">建立</button></div>
      </div>
      <div class="grid2">
        <div class="field"><label for="b-type">課程類型</label><select id="b-type">${opt(db.types, d.typeId)}</select></div>
        <div class="field"><label for="b-coach">教練</label><select id="b-coach">${opt(db.coaches, d.coachId)}</select></div>
      </div>
      <div class="grid3">
        <div class="field"><label for="b-date">日期</label><input id="b-date" type="date" value="${d.date}" required></div>
        <div class="field"><label for="b-start">開始</label><input id="b-start" type="time" step="300" value="${d.start}" required></div>
        <div class="field"><label for="b-dur">分鐘</label><input id="b-dur" type="number" min="15" step="5" value="${d.dur}" required></div>
      </div>
      <div class="grid2">
        <div class="field"><label for="b-room">教室／器械</label><select id="b-room">${opt(db.rooms, d.roomId)}</select></div>
        ${ex ? `<div class="field"><label for="b-status">狀態</label><select id="b-status">${Object.entries(STATUS).map(([k,s])=>`<option value="${k}" ${k===d.status?'selected':''}>${s.label}${s.charge?'':'（不扣堂）'}</option>`).join('')}</select></div>`
             : `<div class="field"><label for="b-repeat">每週重複</label><select id="b-repeat">${[1,2,4,6,8,10,12].map(n=>`<option value="${n}">${n===1?'不重複':`連續 ${n} 週`}</option>`).join('')}</select></div>`}
      </div>
      ${ex && ex.seriesId ? `<label class="small" style="display:flex;gap:8px;align-items:center"><input type="checkbox" id="b-series"> 同時套用到這個系列之後的課（時間、教練、教室、會員）</label>` : ''}
      <div class="field"><label for="b-note">備註</label><input id="b-note" value="${esc(d.note)}" placeholder="例：今天加強側躺系列"></div>
      <div id="b-warn"></div>
      <div class="acts">
        ${ex ? `<span class="left"><button type="button" class="btn danger" id="b-del">刪除</button>${ex.seriesId?`<button type="button" class="btn danger" id="b-del-series">刪除此堂及之後</button>`:''}</span>` : ''}
        <button type="button" class="btn" data-close>取消</button><button class="btn primary" type="submit" id="b-save">儲存</button>
      </div>
    </form>`, (m, close) => {
    const repeatN = () => Number($('#b-repeat', m)?.value || 1);
    function readForm(){
      d.typeId = $('#b-type', m).value; d.coachId = $('#b-coach', m).value; d.roomId = $('#b-room', m).value;
      d.date = $('#b-date', m).value; d.start = $('#b-start', m).value; d.dur = Number($('#b-dur', m).value) || 55;
      d.note = $('#b-note', m).value.trim(); if (ex) d.status = $('#b-status', m).value;
    }
    function drawMembers(){
      $('#b-mchips', m).innerHTML = d.memberIds.length ? d.memberIds.map(id => `<span class="mchip">${esc(mName(id))}<button type="button" data-rm="${id}" aria-label="移除 ${esc(mName(id))}">×</button></span>`).join('') : `<span class="small muted">尚未加入會員</span>`;
      $('#b-madd', m).innerHTML = `<option value="">＋ 從名單加入會員…</option>` + db.members.filter(x => !d.memberIds.includes(x.id)).map(x => `<option value="${x.id}">${esc(x.name)}（剩 ${credits(x).left} 堂）</option>`).join('');
    }
    function check(){
      readForm();
      const w = [];
      if (!d.memberIds.length) w.push('還沒有加入會員');
      const t = typeOf(d.typeId);
      if (t && d.memberIds.length > t.cap) w.push(`${t.name} 上限 ${t.cap} 人，目前 ${d.memberIds.length} 人`);
      const n = repeatN();
      for (let i = 0; i < n; i++) {
        const occ = { ...d, date: ymd(addDays(parse(d.date), i*7)) };
        w.push(...conflicts(occ, ex ? [ex.id] : []));
      }
      d.memberIds.forEach(id => { const mm = memberOf(id); if (!mm) return; const left = credits(mm).left - (ex && ex.memberIds.includes(id) ? 0 : n); if (left < 0) w.push(`${mm.name} 堂數不足（排完會是 ${left} 堂），記得提醒續卡`); });
      const box = $('#b-warn', m);
      box.innerHTML = w.length ? `<div class="warns"><b>請留意</b>${w.map(x=>`<span>・${esc(x)}</span>`).join('')}</div>` : (d.memberIds.length ? `<div class="warns ok">時段沒有衝突${n>1?`，將建立 ${n} 堂課`:''}</div>` : '');
      $('#b-save', m).textContent = w.some(x => x.includes('已有') || x.includes('使用')) ? '仍要儲存' : '儲存';
    }
    drawMembers(); check();
    $('#b-type', m).addEventListener('change', () => { const t = typeOf($('#b-type', m).value); if (t) $('#b-dur', m).value = t.dur; check(); });
    m.addEventListener('input', e => { if (e.target.id !== 'b-mnew') check(); });
    m.addEventListener('change', e => { if (e.target.id === 'b-madd' && e.target.value) { d.memberIds.push(e.target.value); drawMembers(); check(); } else check(); });
    m.addEventListener('click', e => { const rm = e.target.closest('[data-rm]'); if (rm) { d.memberIds = d.memberIds.filter(x => x !== rm.dataset.rm); drawMembers(); check(); } });
    $('#b-mnew-btn', m).onclick = () => {
      const name = $('#b-mnew', m).value.trim(); if (!name) return;
      const nm = { id:uid('m'), name, phone:'', note:'', packages:[] }; db.members.push(nm); d.memberIds.push(nm.id);
      $('#b-mnew', m).value = ''; save(); drawMembers(); check(); toast(`已建立會員 ${name}，可稍後到「會員」補資料`);
    };
    $('#bf', m).onsubmit = e => {
      e.preventDefault(); readForm();
      if (!d.coachId || !d.typeId) return toast('請先到「設定」建立教練與課程類型');
      if (ex) {
        const applySeries = $('#b-series', m)?.checked;
        Object.assign(ex, d);
        if (applySeries) db.bookings.filter(b => b.seriesId === ex.seriesId && b.id !== ex.id && b.date > ex.date).forEach(b => Object.assign(b, { start:d.start, dur:d.dur, coachId:d.coachId, roomId:d.roomId, typeId:d.typeId, memberIds:[...d.memberIds] }));
        close(); commit('預約已更新');
      } else {
        const n = repeatN(), sid = n > 1 ? uid('s') : null;
        for (let i = 0; i < n; i++) db.bookings.push({ ...d, memberIds:[...d.memberIds], id:uid('b'), date: ymd(addDays(parse(d.date), i*7)), ...(sid ? {seriesId:sid} : {}) });
        close(); commit(n > 1 ? `已建立 ${n} 堂每週課程` : '預約已建立');
      }
    };
    if (ex) {
      $('#b-del', m).onclick = () => { close(); confirmBox('刪除這堂課？', `<p style="margin:0">${fmtMD(ex.date)} ${ex.start}・${esc(ex.memberIds.map(mName).join('、'))}</p><p class="small muted">若只是會員請假，建議把狀態改成「請假」保留紀錄。</p>`, '刪除', () => { db.bookings = db.bookings.filter(b => b !== ex); commit('已刪除'); }); };
      if (ex.seriesId) $('#b-del-series', m).onclick = () => { const list = db.bookings.filter(b => b.seriesId === ex.seriesId && b.date >= ex.date); close(); confirmBox('刪除此堂及之後的課？', `<p style="margin:0">共 ${list.length} 堂（${fmtMD(ex.date)} 起，每週 ${ex.start}）。</p>`, `刪除 ${list.length} 堂`, () => { db.bookings = db.bookings.filter(b => !list.includes(b)); commit(`已刪除 ${list.length} 堂`); }); };
    }
  });
}

// ===== members =====
function memberView(){
  const q = ui.mq.trim();
  const list = db.members.filter(m => !q || m.name.includes(q) || (m.phone||'').includes(q)).sort((a,b)=>a.name.localeCompare(b.name,'zh-Hant'));
  if (!ui.mSel || !memberOf(ui.mSel)) ui.mSel = list[0]?.id || null;
  const sel = memberOf(ui.mSel);
  return `<div class="mview">
    <aside class="panel mlist">
      <div class="tools"><input id="mq" placeholder="搜尋姓名或電話" value="${esc(ui.mq)}" aria-label="搜尋會員"><button class="btn sm" id="m-add">＋ 會員</button></div>
      <ul>${list.map(m => { const l = credits(m).left; return `<li><button class="${m.id===ui.mSel?'on':''}" data-msel="${m.id}"><span>${esc(m.name)}</span><span class="pill ${l<=0?'bad':l<=2?'warn':''} num">剩 ${l}</span></button></li>`; }).join('') || '<li class="empty">找不到會員</li>'}</ul>
    </aside>
    <section class="panel">${sel ? memberDetail(sel) : '<div class="empty">還沒有會員，按「＋ 會員」新增。</div>'}</section>
  </div>`;
}
function memberDetail(m){
  const cr = credits(m), now = new Date();
  const mine = db.bookings.filter(b => b.memberIds.includes(m.id)).sort((a,b)=>(a.date+a.start).localeCompare(b.date+b.start));
  const up = mine.filter(b => new Date(`${b.date}T${b.start}`) >= now), past = mine.filter(b => new Date(`${b.date}T${b.start}`) < now).reverse().slice(0, 12);
  const row = b => { const c = coachOf(b.coachId); return `<tr class="click" data-bk="${b.id}"><td class="num">${fmtMD(b.date)}</td><td class="num">${b.start}–${endOf(b)}</td><td><span style="display:inline-flex;align-items:center;gap:6px;--cc:var(--c${c?.color??0})"><span class="dot"></span>${esc(c?.name)}</span></td><td>${esc(typeOf(b.typeId)?.name)}</td><td>${esc(roomOf(b.roomId)?.name)}</td><td><span class="pill ${b.status==='done'?'ok':b.status==='noshow'?'bad':b.status==='leave'?'warn':''}">${STATUS[b.status].label}</span></td></tr>`; };
  const tbl = rows => rows.length ? `<div class="tbl"><table><thead><tr><th>日期</th><th>時間</th><th>教練</th><th>課程</th><th>教室</th><th>狀態</th></tr></thead><tbody>${rows.map(row).join('')}</tbody></table></div>` : `<p class="muted small" style="margin:0">沒有紀錄</p>`;
  return `<div class="mdetail">
    <div class="mhead"><div><h2>${esc(m.name)}</h2><div class="muted small num">${esc(m.phone || '未填電話')}${m.note ? `・${esc(m.note)}` : ''}</div></div>
      <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn primary" data-new="1" data-nm="${m.id}">＋ 為此會員排課</button><button class="btn" data-mfocus="${m.id}">在課表上標示</button><button class="btn" data-medit="${m.id}">編輯資料</button></div></div>
    <div class="credit">
      <div><span class="label">剩餘堂數</span><span class="v num ${cr.left<=0?'zero':cr.left<=2?'low':''}">${cr.left}</span></div>
      <div><span class="label">已購買</span><span class="v num">${cr.bought}</span></div>
      <div><span class="label">已使用</span><span class="v num">${cr.used}</span></div>
      <div><span class="label">之後已排</span><span class="v num">${cr.upcoming}</span></div>
    </div>
    <div><div class="sec-title"><h3>接下來的課</h3></div>${tbl(up)}</div>
    <div><div class="sec-title"><h3>最近上課紀錄</h3><span class="small muted">最多顯示 12 筆</span></div>${tbl(past)}</div>
    <div><div class="sec-title"><h3>購買紀錄</h3><button class="btn sm" data-pkg="${m.id}">＋ 新增購買</button></div>
      ${m.packages.length ? `<div class="tbl"><table><thead><tr><th>日期</th><th>堂數</th><th>說明</th><th></th></tr></thead><tbody>${m.packages.map(p=>`<tr><td class="num">${p.date}</td><td class="num">${p.count}</td><td>${esc(p.note)}</td><td><button class="btn sm danger" data-pkdel="${m.id}|${p.id}">刪除</button></td></tr>`).join('')}</tbody></table></div>` : `<p class="muted small" style="margin:0">還沒有購買紀錄</p>`}
    </div>
  </div>`;
}
function editMember(id){
  const m = id ? memberOf(id) : { name:'', phone:'', note:'' };
  modal(`<h3>${id?'編輯會員':'新增會員'}</h3><form class="form" id="mf">
    <div class="field"><label for="mf-name">姓名</label><input id="mf-name" required value="${esc(m.name)}"></div>
    <div class="field"><label for="mf-phone">電話</label><input id="mf-phone" inputmode="tel" value="${esc(m.phone)}"></div>
    <div class="field"><label for="mf-note">身體狀況／備註</label><input id="mf-note" value="${esc(m.note)}" placeholder="例：下背舊傷"></div>
    ${id?'':`<div class="field"><label for="mf-pk">首次購買堂數（可留空）</label><input id="mf-pk" type="number" min="0" placeholder="例：10"></div>`}
    <div class="acts">${id?`<span class="left"><button type="button" class="btn danger" id="mf-del">刪除會員</button></span>`:''}<button type="button" class="btn" data-close>取消</button><button class="btn primary">儲存</button></div></form>`,
  (el, close) => {
    $('#mf', el).onsubmit = e => {
      e.preventDefault();
      const v = { name:$('#mf-name').value.trim(), phone:$('#mf-phone').value.trim(), note:$('#mf-note').value.trim() };
      if (id) Object.assign(m, v);
      else { const pk = Number($('#mf-pk').value || 0); const nm = { id:uid('m'), ...v, packages: pk ? [{ id:uid('p'), date:ymd(TODAY), count:pk, note:`${pk} 堂課卡` }] : [] }; db.members.push(nm); ui.mSel = nm.id; }
      close(); commit(id ? '會員資料已更新' : '已新增會員');
    };
    if (id) $('#mf-del', el).onclick = () => {
      const n = db.bookings.filter(b => b.memberIds.includes(id) && b.status==='booked').length;
      close(); confirmBox(`刪除 ${esc(m.name)}？`, `<p style="margin:0">${n ? `這位會員還有 ${n} 堂未上的課，會一併從課表移除。` : '過去的上課紀錄會保留，但會顯示為「已刪除會員」。'}</p>`, '刪除', () => {
        db.bookings.forEach(b => { if (b.status==='booked') b.memberIds = b.memberIds.filter(x => x !== id); });
        db.bookings = db.bookings.filter(b => b.memberIds.length || b.status !== 'booked');
        db.members = db.members.filter(x => x.id !== id); if (ui.focus === id) ui.focus = ''; ui.mSel = null; commit('會員已刪除');
      });
    };
  });
}
function addPackage(id){
  const m = memberOf(id);
  modal(`<h3>新增購買｜${esc(m.name)}</h3><form class="form" id="pf">
    <div class="grid2"><div class="field"><label for="pf-n">堂數</label><input id="pf-n" type="number" min="1" value="10" required></div>
    <div class="field"><label for="pf-d">日期</label><input id="pf-d" type="date" value="${ymd(TODAY)}" required></div></div>
    <div class="field"><label for="pf-note">說明</label><input id="pf-note" placeholder="例：10 堂私人課卡・刷卡"></div>
    <div class="acts"><button type="button" class="btn" data-close>取消</button><button class="btn primary">新增</button></div></form>`,
  (el, close) => $('#pf', el).onsubmit = e => { e.preventDefault(); const n = Number($('#pf-n').value); m.packages.push({ id:uid('p'), date:$('#pf-d').value, count:n, note:$('#pf-note').value.trim() || `${n} 堂課卡` }); close(); commit(`已為 ${m.name} 加入 ${n} 堂`); });
}

// ===== settings =====
function settingsView(){
  const s = db.settings;
  const colorSel = (c) => `<select data-set="coach-color" data-id="${c.id}" aria-label="顏色">${['青綠','紫','黃褐','藍','玫瑰','橄欖'].map((n,i)=>`<option value="${i}" ${i===c.color?'selected':''}>${n}</option>`).join('')}</select>`;
  return `<div class="settings">
    <div class="panel"><h3>基本設定</h3>
      <div class="field"><label for="st-name">教室名稱</label><input id="st-name" data-set="studio" value="${esc(s.studio)}"></div>
      <div class="grid2"><div class="field"><label for="st-open">課表開始時間</label><input id="st-open" type="time" step="1800" data-set="open" value="${s.open}"></div>
      <div class="field"><label for="st-close">課表結束時間</label><input id="st-close" type="time" step="1800" data-set="close" value="${s.close}"></div></div>
    </div>
    <div class="panel"><h3>教練</h3><div class="rowlist">${db.coaches.map(c=>`<div class="srow" style="--cc:var(--c${c.color})"><span class="dot"></span><input class="grow" data-set="coach-name" data-id="${c.id}" value="${esc(c.name)}" aria-label="教練名稱">${colorSel(c)}<button class="btn sm danger" data-del-coach="${c.id}">刪除</button></div>`).join('')}</div>
      <button class="btn sm" id="add-coach" style="justify-self:start">＋ 新增教練</button></div>
    <div class="panel"><h3>教室／器械</h3><div class="rowlist">${db.rooms.map(r=>`<div class="srow"><input class="grow" data-set="room-name" data-id="${r.id}" value="${esc(r.name)}" aria-label="教室名稱"><button class="btn sm danger" data-del-room="${r.id}">刪除</button></div>`).join('')}</div>
      <button class="btn sm" id="add-room" style="justify-self:start">＋ 新增教室／器械</button></div>
    <div class="panel"><h3>課程類型</h3><div class="small muted">預設分鐘數與人數上限，排課時會自動帶入並檢查。</div>
      <div class="rowlist">${db.types.map(t=>`<div class="srow"><input class="grow" data-set="type-name" data-id="${t.id}" value="${esc(t.name)}" aria-label="課程名稱"><input class="n num" type="number" min="15" step="5" data-set="type-dur" data-id="${t.id}" value="${t.dur}" aria-label="分鐘"><span class="small muted">分</span><input class="n num" type="number" min="1" data-set="type-cap" data-id="${t.id}" value="${t.cap}" aria-label="人數上限"><span class="small muted">人</span><button class="btn sm danger" data-del-type="${t.id}">刪除</button></div>`).join('')}</div>
      <button class="btn sm" id="add-type" style="justify-self:start">＋ 新增課程類型</button></div>
    <div class="panel"><h3>資料備份</h3>
      <p class="small muted" style="margin:0">資料儲存在這台電腦的瀏覽器中，換電腦或清除瀏覽器資料後就會不見。請定期匯出備份。</p>
      <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn" id="export">匯出備份</button><button class="btn" id="import">匯入備份</button></div>
      <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn danger" id="reset-sample">重新載入範例資料</button><button class="btn danger" id="wipe">清空全部資料</button></div>
    </div>
  </div>`;
}
function exportData(){
  const json = JSON.stringify(db, null, 1);
  modal(`<h3>匯出備份</h3><p class="small muted" style="margin:0">下載備份檔；若無法下載，可複製下方文字另存。</p>
    <textarea class="mono" id="ex-txt" readonly>${esc(json)}</textarea>
    <div class="acts"><button class="btn" id="ex-copy">複製文字</button><button class="btn primary" id="ex-dl">下載備份檔</button><button class="btn" data-close>關閉</button></div>`,
  el => {
    $('#ex-copy', el).onclick = () => { const t = $('#ex-txt', el); navigator.clipboard?.writeText(json).then(()=>toast('已複製'), ()=>{ t.select(); toast('請按 Ctrl/⌘+C 複製'); }) ?? (t.select()); };
    $('#ex-dl', el).onclick = () => { try { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([json], {type:'application/json'})); a.download = `排課表備份-${ymd(new Date())}.json`; document.body.appendChild(a); a.click(); a.remove(); } catch(e) { toast('無法下載，請改用複製文字'); } };
  });
}
function importData(){
  modal(`<h3>匯入備份</h3><p class="small muted" style="margin:0">選擇備份檔，或貼上備份文字。匯入後會取代目前所有資料。</p>
    <input type="file" id="im-file" accept=".json,application/json">
    <textarea class="mono" id="im-txt" placeholder="或在這裡貼上備份文字"></textarea>
    <div class="acts"><button class="btn" data-close>取消</button><button class="btn primary" id="im-go">匯入並取代</button></div>`,
  (el, close) => {
    $('#im-file', el).onchange = e => { const f = e.target.files[0]; if (!f) return; const r = new FileReader(); r.onload = () => $('#im-txt', el).value = r.result; r.readAsText(f); };
    $('#im-go', el).onclick = () => {
      try { const d = JSON.parse($('#im-txt', el).value); if (!Array.isArray(d.bookings) || !Array.isArray(d.members)) throw 0; db = d; close(); commit('備份已匯入'); }
      catch(e) { toast('內容不是有效的備份檔，請確認後再試'); }
    };
  });
}

// ===== events =====
document.addEventListener('click', e => {
  const t = e.target;
  const b = t.closest('button, tr.click, .lane');
  if (!b) return;
  const d = b.dataset;
  if (b.classList.contains('lane') && !t.closest('.blk')) {
    const y = e.clientY - b.getBoundingClientRect().top;
    const m = toMin(db.settings.open) + Math.floor(y / PX / 30) * 30;
    return openBooking({ date: d.ld, coachId: d.lc, start: fromMin(m), memberIds: ui.focus ? [ui.focus] : [] });
  }
  if (d.view) { ui.view = d.view; render(); }
  else if (d.bk) openBooking({ id: d.bk });
  else if (d.new) openBooking({ memberIds: d.nm ? [d.nm] : ui.focus && ui.view !== 'members' ? [ui.focus] : [] });
  else if (d.shift) { ui.date = ymd(addDays(parse(ui.date), Number(d.shift) * (ui.view==='day'?1:7))); render(); }
  else if (d.today) { ui.date = ymd(TODAY); render(); }
  else if (d.goday) { ui.date = d.goday; ui.view = 'day'; render(); }
  else if (d.coach) { ui.hidden.has(d.coach) ? ui.hidden.delete(d.coach) : ui.hidden.add(d.coach); render(); }
  else if (d.mopen) { ui.mSel = d.mopen; ui.view = 'members'; render(); }
  else if (d.msel) { ui.mSel = d.msel; render(); }
  else if (d.mfocus) { ui.focus = d.mfocus; ui.view = 'week'; render(); }
  else if (d.medit) editMember(d.medit);
  else if (d.pkg) addPackage(d.pkg);
  else if (d.pkdel) { const [mid,pid] = d.pkdel.split('|'); const m = memberOf(mid); m.packages = m.packages.filter(p => p.id !== pid); commit('已刪除購買紀錄'); }
  else if (d.delCoach) { const n = db.bookings.filter(x => x.coachId === d.delCoach).length; if (n) return toast(`這位教練還有 ${n} 堂課，請先改派其他教練`); db.coaches = db.coaches.filter(c => c.id !== d.delCoach); commit('已刪除教練'); }
  else if (d.delRoom) { const n = db.bookings.filter(x => x.roomId === d.delRoom).length; if (n) return toast(`還有 ${n} 堂課使用這間教室，請先改到其他教室`); db.rooms = db.rooms.filter(r => r.id !== d.delRoom); commit('已刪除'); }
  else if (d.delType) { const n = db.bookings.filter(x => x.typeId === d.delType).length; if (n) return toast(`還有 ${n} 堂課使用這個類型，無法刪除`); db.types = db.types.filter(x => x.id !== d.delType); commit('已刪除'); }
  else if (b.id === 'm-add') editMember(null);
  else if (b.id === 'add-coach') { const used = new Set(db.coaches.map(c=>c.color)); db.coaches.push({ id:uid('k'), name:'新教練', color:[0,1,2,3,4,5].find(i=>!used.has(i)) ?? 0 }); commit(); }
  else if (b.id === 'add-room') { db.rooms.push({ id:uid('r'), name:'新教室' }); commit(); }
  else if (b.id === 'add-type') { db.types.push({ id:uid('t'), name:'新課程', dur:55, cap:1 }); commit(); }
  else if (b.id === 'export') exportData();
  else if (b.id === 'import') importData();
  else if (b.id === 'clear-sample') confirmBox('清除範例資料？', '<p style="margin:0">會刪除所有範例會員與課程，保留教練、教室與課程類型設定（可在「設定」修改）。</p>', '清除', () => { db.members = []; db.bookings = []; db.sample = false; ui.focus = ''; commit('已清除，可以開始建立會員與排課'); });
  else if (b.id === 'reset-sample') confirmBox('重新載入範例資料？', '<p style="margin:0">目前所有資料會被範例取代。如需保留，請先匯出備份。</p>', '載入範例', () => { db = seed(); ui.focus = ''; commit('已載入範例資料'); });
  else if (b.id === 'wipe') confirmBox('清空全部資料？', '<p style="margin:0">會員、課程、教練與設定都會刪除，無法復原。如需保留，請先匯出備份。</p>', '清空', () => { db = { sample:false, settings:{ studio:'我的皮拉提斯教室', open:'07:00', close:'22:00' }, coaches:[], rooms:[], types:[{id:uid('t'),name:'私人課',dur:55,cap:1}], members:[], bookings:[] }; ui.focus=''; commit('已清空'); });
});
document.addEventListener('change', e => {
  const t = e.target, d = t.dataset;
  if (t.id === 'jump' && t.value) { ui.date = t.value; render(); }
  else if (t.id === 'focus') { ui.focus = t.value; render(); }
  else if (d.set) {
    const v = t.value;
    if (d.set === 'studio') db.settings.studio = v.trim() || db.settings.studio;
    else if (d.set === 'open' || d.set === 'close') { if (v) db.settings[d.set] = v; if (toMin(db.settings.close) <= toMin(db.settings.open)) { toast('結束時間要晚於開始時間'); db.settings.close = fromMin(Math.min(toMin(db.settings.open)+60, 1439)); } }
    else if (d.set === 'coach-name') coachOf(d.id).name = v.trim() || '未命名';
    else if (d.set === 'coach-color') coachOf(d.id).color = Number(v);
    else if (d.set === 'room-name') roomOf(d.id).name = v.trim() || '未命名';
    else if (d.set === 'type-name') typeOf(d.id).name = v.trim() || '未命名';
    else if (d.set === 'type-dur') typeOf(d.id).dur = Math.max(15, Number(v) || 55);
    else if (d.set === 'type-cap') typeOf(d.id).cap = Math.max(1, Number(v) || 1);
    commit('已儲存');
  }
});
document.addEventListener('input', e => {
  if (e.target.id === 'mq') { ui.mq = e.target.value; render(); const i = $('#mq'); i.focus(); i.setSelectionRange(i.value.length, i.value.length); }
});
render();
</script>

</body>
</html>
